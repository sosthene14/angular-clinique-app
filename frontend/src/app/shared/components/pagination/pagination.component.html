<div class="flex items-center justify-between border-t border-gh-border pt-4">
  <div class="text-sm text-gh-fg-muted">
    Affichage de {{ startItem }} à {{ endItem }} sur {{ totalElements }} résultats
  </div>
  
  <div class="flex items-center gap-2">
    <button
      (click)="onPageChange(currentPage - 1)"
      [disabled]="currentPage === 0"
      class="btn-secondary disabled:opacity-50 disabled:cursor-not-allowed"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
      </svg>
    </button>

    @for (page of visiblePages; track page) {
      <button
        (click)="onPageChange(page)"
        [class.bg-gh-accent]="page === currentPage"
        [class.text-white]="page === currentPage"
        class="btn-secondary min-w-[40px]"
      >
        {{ page + 1 }}
      </button>
    }

    <button
      (click)="onPageChange(currentPage + 1)"
      [disabled]="currentPage >= totalPages - 1"
      class="btn-secondary disabled:opacity-50 disabled:cursor-not-allowed"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
      </svg>
    </button>
  </div>
</div>
